<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gearhead Lab - Bulk Upload Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Compat Libraries (Works everywhere without module errors) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-zinc-950 text-white p-6 font-sans min-h-screen flex items-center justify-center">
  <div class="max-w-lg w-full bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-xl space-y-4">
    <h1 class="text-xl font-extrabold text-orange-500">Bulk Data Uploader</h1>
    <p class="text-xs text-zinc-400">Target collection: <span id="target-display" class="font-mono text-amber-400 font-bold">engines</span></p>
    
    <button id="upload-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-zinc-950 font-bold py-3 rounded-xl transition shadow-lg shadow-orange-500/20">
      Start Bulk Upload
    </button>
    
    <div id="status" class="text-xs font-mono text-zinc-300 bg-zinc-950 p-4 rounded-xl border border-zinc-800 h-48 overflow-y-auto space-y-1">
      Ready to upload...
    </div>
  </div>

  <script>
    // Your Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDnb0ATeGOM1lH-KfGpVMn9BFaQcWn6EuQ",
      authDomain: "gearhead-lab-db.firebaseapp.com",
      projectId: "gearhead-lab-db",
      storageBucket: "gearhead-lab-db.firebasestorage.app",
      messagingSenderId: "683309233523",
      appId: "1:683309233523:web:1b2242fa8bdab1c37ec106"
    };

    // Initialize Firebase Compat
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================================
    // 1. CHANGE TARGET COLLECTION HERE ("engines", "cars", OR "components")
    // ============================================================
    const targetCollection = "engines";

    // ============================================================
    // 2. PASTE YOUR ITEMS INSIDE THIS ARRAY
    // ============================================================
    const itemsToUpload = [
      { name: "GM 3.8L 3800 Series II V6", hp: 240, tq: 280, cost: 1500, hours: 25 },
{ name: "Nissan 3.5L VQ35DE V6", hp: 287, tq: 274, cost: 2200, hours: 30 },
{ name: "Honda 3.5L J35 V6", hp: 250, tq: 247, cost: 1800, hours: 30 },
{ name: "Ford 3.5L EcoBoost V6", hp: 365, tq: 420, cost: 4500, hours: 40 },
{ name: "GM 5.7L LS1 V8", hp: 350, tq: 365, cost: 6500, hours: 40 },
{ name: "GM 6.2L LS3 V8", hp: 430, tq: 425, cost: 8500, hours: 40 },
{ name: "Ford 5.0L Coyote V8", hp: 460, tq: 420, cost: 7500, hours: 45 },
{ name: "Dodge 5.7L HEMI V8", hp: 395, tq: 410, cost: 4200, hours: 35 },
{ name: "Toyota 4.0L 1UZ-FE V8", hp: 256, tq: 260, cost: 2000, hours: 35 },
{ name: "Audi 4.2L V8 (RS4)", hp: 420, tq: 317, cost: 5000, hours: 45 },
{ name: "Dodge 8.4L Viper V10", hp: 645, tq: 600, cost: 18000, hours: 60 },
{ name: "BMW 5.0L S85 V10", hp: 500, tq: 384, cost: 8000, hours: 55 },
{ name: "Toyota 5.0L 1GZ-FE V12", hp: 276, tq: 355, cost: 6500, hours: 60 }

    ];

    document.getElementById('target-display').textContent = targetCollection;

    document.getElementById('upload-btn').onclick = async function() {
      const statusDiv = document.getElementById('status');
      
      if (itemsToUpload.length === 0) {
        statusDiv.innerHTML = "⚠️ No items found in the array! Please edit bulk-upload.html and add items first.";
        return;
      }

      statusDiv.innerHTML = `Starting upload to collection "${targetCollection}"...<br><br>`;

      for (let i = 0; i < itemsToUpload.length; i++) {
        const item = itemsToUpload[i];
        try {
          await db.collection(targetCollection).add(item);
          statusDiv.innerHTML += `✅ (${i + 1}/${itemsToUpload.length}) Added: ${item.name}<br>`;
        } catch (e) {
          statusDiv.innerHTML += `❌ Error adding ${item.name}: ${e.message}<br>`;
        }
      }

      statusDiv.innerHTML += "<br>🎉 Upload complete!";
    };
  </script>
</body>
</html>
